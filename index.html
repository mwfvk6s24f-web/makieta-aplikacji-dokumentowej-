<!DOCTYPE html>

<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fikcyjny dokument</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f2f4f7;

      color: #17202a;

      padding: 20px;

    }

    .app {

      max-width: 400px;

      margin: auto;

    }

    .warning {

      background: #fff3cd;

      color: #664d03;

      padding: 12px;

      border-radius: 12px;

      font-size: 13px;

      text-align: center;

      margin-bottom: 15px;

    }

    .card {

      background: white;

      border-radius: 24px;

      padding: 24px;

      box-shadow: 0 4px 20px #00000015;

    }

    .header {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 25px;

    }

    .avatar {

      width: 65px;

      height: 65px;

      border-radius: 50%;

      background: #dce8f5;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 28px;

    }

    h1 {

      font-size: 22px;

      margin: 0;

    }

    .subtitle {

      color: #68737d;

      margin-top: 5px;

    }

    .photo {

      height: 180px;

      border-radius: 16px;

      background: #d9e2ec;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 60px;

      margin-bottom: 20px;

    }

    .info {

      border-top: 1px solid #e5e7eb;

      padding: 14px 0;

    }

    .label {

      color: #6b7280;

      font-size: 13px;

    }

    .value {

      font-size: 17px;

      margin-top: 5px;

    }

    .fake {

      margin-top: 20px;

      text-align: center;

      font-size: 12px;

      color: #d12c2c;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <div class="app">

    <div class="warning">

      ⚠️ MAKieta UI — NIE JEST PRAWDZIWYM DOKUMENTEM

    </div>

    <div class="card">

      <div class="header">

        <div class="avatar">👤</div>

        <div>

          <h1>Fikcyjny dokument</h1>

          <div class="subtitle">Projekt demonstracyjny</div>

        </div>

      </div>

      <div class="photo">🪪</div>

      <div class="info">

        <div class="label">Imię i nazwisko</div>

        <div class="value">Oliwia Długopolska</div>

      </div>

      <div class="info">

        <div class="label">Data urodzenia</div>

        <div class="value">31.10.2007</div>

      </div>

      <div class="info">

        <div class="label">Numer dokumentu</div>

        <div class="value">DEMO-000000</div>

      </div>

      <div class="fake">

        DOKUMENT FIKCYJNY • TYLKO DO DEMONSTRACJI

      </div>

    </div>

  </div>

</body>

</html>
